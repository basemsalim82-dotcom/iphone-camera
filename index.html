
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<title>iPhone Camera</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold}.logo span{color:#58baff}
.badge{background:#25262b;padding:8px 12px;border-radius:20px;font-size:12px}
main{max-width:520px;margin:auto;padding:10px 16px 35px}
h1{font-size:28px}.sub{color:#aaa;font-size:14px;line-height:1.8}
.preview{height:390px;background:#202127;border:1px solid #41434a;border-radius:25px;margin:22px 0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;object-fit:cover;display:none}
.camera{font-size:70px}
.live{position:absolute;top:14px;right:14px;background:#ffffff20;padding:8px 12px;border-radius:18px;font-size:12px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:13px;padding:15px 8px;font-size:14px;font-weight:bold;cursor:pointer}
.primary{background:#58baff;color:#07121c}.secondary{background:#303139;color:white}
.note{margin-top:18px;padding:14px;background:#1c1d22;border-radius:14px;color:#bbb;font-size:12px;line-height:1.9}
#status{color:#8ed4ff}
</style>
</head>
<body>
<header>
 <div class="logo">iPhone <span>Camera</span></div>
 <div class="badge">CAMERA STUDIO</div>
</header>
<main>
 <h1>الكاميرا 📷</h1>
 <p class="sub">تشغيل الكاميرا يتم بإذن صاحب الهاتف، ويمكنه إيقافها في أي وقت.</p>

 <div class="preview">
  <div class="live" id="live">● متوقفة</div>
  <div class="camera" id="placeholder">📷</div>
  <video id="video" autoplay playsinline muted></video>
 </div>

 <div class="buttons">
  <button class="primary" id="start">تشغيل الكاميرا</button>
  <button class="secondary" id="stop" disabled>إيقاف الكاميرا</button>
 </div>

 <p id="status">الكاميرا متوقفة.</p>
 <div class="note">
  الكاميرا تعمل على هذا الهاتف فقط في هذه النسخة. لا توجد مشاركة عن بُعد حتى الآن. لا تمنح الإذن إلا إذا كنت تريد تشغيل الكاميرا بنفسك.
 </div>
</main>

<script>
const video=document.getElementById('video');
const placeholder=document.getElementById('placeholder');
const live=document.getElementById('live');
const statusText=document.getElementById('status');
const startButton=document.getElementById('start');
const stopButton=document.getElementById('stop');
let stream=null;

startButton.addEventListener('click',async()=>{
 if(!navigator.mediaDevices?.getUserMedia){
  statusText.textContent='المتصفح لا يدعم الكاميرا هنا. افتح الموقع عبر HTTPS.';
  return;
 }
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'user'},audio:false
  });
  video.srcObject=stream;
  video.style.display='block';
  placeholder.style.display='none';
  live.textContent='● الكاميرا تعمل';
  statusText.textContent='الكاميرا تعمل على هذا الهاتف.';
  startButton.disabled=true;
  stopButton.disabled=false;
 }catch(error){
  statusText.textContent=error.name==='NotAllowedError'
   ?'لم يتم منح إذن الكاميرا.'
   :'تعذر تشغيل الكاميرا. تأكد أنها غير مستخدمة في تطبيق آخر.';
 }
});

function stopCamera(){
 if(stream)stream.getTracks().forEach(track=>track.stop());
 stream=null;
 video.srcObject=null;
 video.style.display='none';
 placeholder.style.display='block';
 live.textContent='● متوقفة';
 statusText.textContent='الكاميرا متوقفة.';
 startButton.disabled=false;
 stopButton.disabled=true;
}
stopButton.addEventListener('click',stopCamera);
window.addEventListener('pagehide',stopCamera);
</script>
</body>
</html>
