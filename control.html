<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone Camera | لوحة التحكم</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif}
header{padding:22px;border-bottom:1px solid #303139;font-size:22px;font-weight:bold}
header span{color:#58baff}
main{max-width:520px;margin:auto;padding:22px 16px}
p{color:#aaa;line-height:1.8;font-size:14px}
.card{background:#202127;border:1px solid #373840;border-radius:18px;padding:18px;margin:16px 0}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:12px;background:#58baff;color:#07121c;font-weight:bold;font-size:14px}
.secondary{background:#303139;color:white}
input{width:100%;padding:13px;margin-top:10px;background:#101114;color:white;border:1px solid #444;border-radius:10px}
.status{color:#8ed4ff}
</style>
</head>
<body>
<header>iPhone <span>Camera</span></header>
<main>
<h2>لوحة التحكم</h2>
<p>تجربة اتصال الكاميرا بين جهازين.</p>

<div class="card">
<h3>حالة الاتصال</h3>
<p class="status" id="status">لم يبدأ الاتصال بعد.</p>
<p>رابط الهاتف الآخر:</p>
<input id="link" readonly>
<button id="copy">نسخ رابط الهاتف الآخر</button>
</div>

<div class="card">
<h3>الكاميرا</h3>
<p>بعد إعداد الاتصال، يقدر صاحب الهاتف الآخر يوافق على مشاركة الكاميرا ويوقفها وقت ما يحب.</p>
<button class="secondary" id="check">فحص جاهزية الصفحة</button>
</div>

<p>مشاركة الكاميرا عن بُعد غير مفعّلة في هذه النسخة.</p>
</main>
<script>
document.getElementById('link').value =
 new URL('./',location.href).href;

document.getElementById('copy').onclick=async()=>{
 const field=document.getElementById('link');
 try{
  await navigator.clipboard.writeText(field.value);
  alert('تم نسخ الرابط');
 }catch(e){
  field.select();
  alert('انسخ الرابط يدويًا');
 }
};

document.getElementById('check').onclick=()=>{
 document.getElementById('status').textContent=
 'الصفحة تعمل، لكن اتصال الكاميرا يحتاج إعداد WebRTC وFirebase.';
};
</script>
</body>
</html>
